name: episode
# Uzun bölüm (yatay, 10 yeni durum): haftada 3 (Paz + Sal + Per 19:30 UTC). episode.py 1,5 gün kuralıyla korur
on:
  schedule:
    - cron: "30 19 * * 0,2,4"
    - cron: "0 22 * * 0,2,4"   # yedek: GitHub zamanlayıcı bazen atlıyor; bölüm çıktıysa episode.py atlar
  workflow_dispatch:
    inputs:
      privacy:
        description: Boş = YT_PRIVACY değişkeni (public), deneme için private
        type: choice
        options: ["", private, public]
        default: ""

permissions:
  contents: write

concurrency:
  group: repo-writes
  cancel-in-progress: false

jobs:
  episode:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bölümü üret ve yükle
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          YT_CHANNEL_ID: ${{ secrets.YT_CHANNEL_ID }}
          YT_PRIVACY: ${{ inputs.privacy || vars.YT_PRIVACY }}
        run: python episode.py
      - name: Keep for review
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: episode-${{ github.run_id }}
          path: |
            output/episode-*/episode.mp4
            output/episode-*/thumb.png
          retention-days: 7
          if-no-files-found: ignore
      - name: Commit log
        if: always()
        run: |
          git config user.name "balls-bot"
          git config user.email "bot@users.noreply.github.com"
          git add history.json playlists.json
          git diff --cached --quiet && exit 0
          git commit -m "episode: $(date -u +%F)"
          git pull --rebase
          git push
