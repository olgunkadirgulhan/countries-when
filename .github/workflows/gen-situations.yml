name: gen-situations
# 2026-11-07: kullanılmamış durum havuzunu hep ~90'da tut (günde 3 Short → ~1 ay önde). Haftada 2 kez.
# Gemini yazar + ikinci geçiş doğrular (Orbit: NASA bilgisi, Countryball: güvenlik); sesleri günlük voice-lib üretir.
on:
  schedule:
    - cron: "11 4 * * 1,4"
  workflow_dispatch:
    inputs:
      target:
        default: "90"
      max_new:
        default: "30"
permissions:
  contents: write
concurrency:
  group: repo-writes
  cancel-in-progress: false
jobs:
  gen:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q numpy pillow imageio-ffmpeg requests
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python tools/gen_situations.py --target "${{ inputs.target || '90' }}" --max-new "${{ inputs.max_new || '30' }}"
          python tools/gen_voice_lines.py > /dev/null
      - run: |
          git config user.name "gen-bot"; git config user.email "bot@users.noreply.github.com"
          git add src/bank_auto.json voice_lines.py
          git diff --cached --quiet && exit 0
          git commit -qm "durumlar: otomatik üretim $(date -u +%F)"
          for i in 1 2 3 4 5 6 7 8; do git pull --rebase -q && git push -q && break; sleep $((i*15)); done
