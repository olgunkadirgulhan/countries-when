name: comments
# Yeni videolara ilk yorum + yorumlara kişisel cevap (tools/auto_reply.py), saatte bir
on:
  schedule:
    - cron: "33 * * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: comments
  cancel-in-progress: false

jobs:
  reply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -q google-api-python-client google-auth requests
      - name: Countries When
        continue-on-error: true
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          CHANNEL_NAME: "Countries When"
          CHANNEL_ABOUT: "Countryball-style Shorts: how different countries react to the same situation. Friendly stereotypes."
          CHANNEL_KIND: general
          CHANNEL_LANG: en
          STATE_FILE: comment_replies.json
          REQUESTS_FILE: viewer_requests.json
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FIRST_QUESTIONS: '["Which one is YOUR country? 🌍", "Which country should we add next? 👇", "Is this true for your country? 😂", "What does YOUR country do in this situation? 👇", "Which one made you laugh the most? 😂", "Name a situation for the next video! 💡", "Which country is the most relatable? 🤔", "Tag a friend from one of these countries 🌍", "Where are you watching from? 📍", "Is your country missing? Tell us! 👇", "Which one is 100% accurate? 💯", "What should Turkey do next time? 😄", "Rate this from 1 to 10 🌍", "Which country would you visit? ✈️", "Comment your country flag! 👇"]'
        run: python tools/auto_reply.py
      - run: |
          git config user.name "comment-bot"
          git config user.email "bot@users.noreply.github.com"
          git add comment_replies*.json viewer_requests*.json 2>/dev/null || true
          git diff --cached --quiet && exit 0
          git commit -m "comments: $(date -u +%F-%H%M)"
          for i in 1 2 3; do git pull -q --rebase && git push -q && exit 0; sleep 5; done
